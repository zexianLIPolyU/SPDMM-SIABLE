[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spdmm"
version = "0.2.0"
description = "SPDMM state preparation and SIABLE block encoding via diagonal matrix migration"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Zexian Li"},
    {name = "Xiao-Ming Zhang"},
    {name = "Guofeng Zhang"},
]
keywords = ["quantum", "state-preparation", "block-encoding", "qiskit", "spdmm", "siable"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: OS Independent",
]
dependencies = [
    "qiskit>=2.1,<3.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "numba>=0.58",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]
benchmark = [
    "qclib>=0.1.15",
    "pandas>=2.0",
    "matplotlib>=3.6",
]
all = [
    "qclib>=0.1.15",
    "pandas>=2.0",
    "matplotlib>=3.6",
    "pytest>=7.0",
]

# Exact versions used to generate tests/data/*.csv
# (run ``pip install -r requirements.txt`` to match them)
reproduce = [
    "qiskit==2.4.1",
    "numpy==2.4.4",
    "scipy==1.17.1",
    "numba==0.65.1",
    "qclib==0.1.15",
    "pandas==3.0.2",
    "matplotlib==3.10.8",
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
include = ["spdmm*"]
exclude = ["tests*", "plot_figure*", "examples*", "docs*"]
